variables:
  AZURE_SERVICE: segy-to-vds-conversion
  AZURE_DEPLOYMENTS_SUBDIR: deployments/scripts/azure
  AZURE_CLIENT_ID: ${AZURE_PRINCIPAL_ID}
  AZURE_CLIENT_SECRET: ${AZURE_PRINCIPAL_SECRET}
  AZURE_AD_APP_RESOURCE_ID: ${AZURE_APP_ID}


  OSDU_GCP_COMMUNITY_BUCKET: gs://us-central1-osdu-airflow-f361a286-bucket
  OSDU_GCP_PRESHIP_BUCKET: gs://us-central1-airflow-v2-36b0ff41-bucket
  OSDU_GCP_COMMUNITY_PROJECT: nice-etching-277309
  OSDU_GCP_PRE_SHIP_PROJECT: 	osdu-service-prod
  OSDU_GCP_SERVICE: segy-to-vds-conversion
  OSDU_GCP_VENDOR: gcp
  OSDU_GCP_K8S_NODE_POOLS: default-pool,pool-1,pool-2
  OSDU_GCP_SEISMIC_STORE_SERVICE_ENDPOINT: https://seismic-store-attcrcktoa-uc.a.run.app/api/v3
  SEGY_VDS_DOCKER_IMAGE: "community.opengroup.org:5555/osdu/platform/domain-data-mgmt-services/seismic/open-vds/openvds-ingestion:latest"
  OSDU_GCP_OUTPUT_DAG_DIR: bootstrapped_dag
  OSDU_GCP_SEISMIC_STORE_SERVICE_COMMUNITY_ENDPOINT: https://community.gcp.gnrg-osdu.projects.epam.com/api/seismic-store/v3
  OSDU_GCP_SEISMIC_STORE_SERVICE_PRE_SHIP_ENDPOINT: https://preship.osdu.club/api/seismic-store/v3


image: google/cloud-sdk:alpine

stages:
  - review
  - linters
  - containerize
  - bootstrap_dag
  - publish_dag
  - deploy
  - build
  - scan
  - bootstrap
  - integration
  - attribution
  - publish

include:
  # pipeline logic
  - project: "osdu/platform/ci-cd-pipelines"
    ref: release/0.14
    file: "standard-setup.yml"

  - local: "/devops/azure/override-stages.yml"
  # in case of any changes at project directory structure please make adjustments to Deployment Framework scripts
  - local: "/deployments/scripts/gcp/bootstrap_segy_to_vds.yaml"

  - project: "osdu/platform/ci-cd-pipelines"
    ref: release/0.14
    file: "cloud-providers/osdu-gcp-dag.yaml"

  - local: "/devops/gcp/override-stages.yml"
