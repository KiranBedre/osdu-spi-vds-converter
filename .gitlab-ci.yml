variables:
  AZURE_SERVICE: segy-to-vds-conversion
  AZURE_DEPLOYMENTS_SUBDIR: deployments/scripts/azure
  AZURE_CLIENT_ID: ${AZURE_PRINCIPAL_ID}
  AZURE_CLIENT_SECRET: ${AZURE_PRINCIPAL_SECRET}
  AZURE_AD_APP_RESOURCE_ID: ${AZURE_APP_ID}
  VDS_DAG: https://community.opengroup.org/osdu/platform/domain-data-mgmt-services/seismic/open-vds/container_registry/2137

image: google/cloud-sdk:alpine

stages:
  - linters
  - containerize
  - deploy
  - review
  - build
  - scan
  - bootstrap
  - integration
  - attribution
  - publish

isort:
  image: johnybear/osdu-airflow:python36-2
  allow_failure: true
  stage: linters
  script:
    - python -m pip install setuptools isort
    - isort -c -v src/*/*.py || EXIT_CODE=$?
    - exit ${EXIT_CODE}
  only:
    variables:
    - $AZURE == 'false'


osdu-gcp-deploy:
  stage: deploy
  script:
    - gcloud auth activate-service-account --key-file=$OSDU_GCP_DEPLOY_FILE
    - cd src
    - gsutil -m rsync -d -R dags $OSDU_GCP_DEPL_TARGET/dags/segy_to_vds
  except:
    - /^release\/*/
  when: manual
  only:
    variables:
    - $AZURE == 'false'

include:
  # pipeline logic
  - project: "osdu/platform/ci-cd-pipelines"
    ref: 'release/0.9'
    file: "standard-setup.yml"

  - local: "/devops/azure/override-stages.yml"
