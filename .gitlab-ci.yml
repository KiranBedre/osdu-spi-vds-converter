variables:
  IBM_HELM_DAG_PATH: devops/ibm/ibm-vds-dag
  AZURE_SERVICE: segy-to-vds-conversion
  AZURE_DEPLOYMENTS_SUBDIR: deployments/scripts/azure
  AZURE_CLIENT_ID: ${AZURE_PRINCIPAL_ID}
  AZURE_CLIENT_SECRET: ${AZURE_PRINCIPAL_SECRET}
  AZURE_AD_APP_RESOURCE_ID: ${AZURE_APP_ID}

  # AWS env vars
  AWS_DEPLOY_TARGET: EKS
  # AWS collection vars
  AWS_COLLECTION_PATH: https://community.opengroup.org/osdu/platform/testing/-/raw/master/Dev/43_CICD_SEGY_VDS_SSDMS/OpenVDS%20SSDMS_to_SSDMS%20conversion%20CI-CD.postman_collection.json
  AWS_COLLECTION_ENV_PATH: https://community.opengroup.org/osdu/platform/testing/-/raw/master/Postman%20Collection/00_CICD_Setup_Environment/aws.OSDU%20R3%20PROD%20v2.4.postman_environment.json
  AWS_COLLECTION_TEST_PATH: ""
  AWS_TEST_FILE_INPUT: ""
  AWS_TEST_FILE_KEY: ""
  #Skip stages Variables
  SKIP_BOOTSTRAP: "true"
  SKIP_PUBLISH: "true"
  SKIP_END_TO_END: "false"
  AWS_POSTMAN_TESTS_TO_SKIP: "3 Ingest Seismic|3.2 Check the triggered Ingestion workflow status|4.1 Unlock SEGY|4.4 Check the triggered OpenVDS workflow status|5 Validate Ingestion|6 Get VDS info|7 Clean-up"
image: google/cloud-sdk:alpine

stages:
  - review
  - linters
  - build
  - test
  - containerize
  - bootstrap_dag
  - publish_dag
  - deploy
  - scan
  - bootstrap
  - end_to_end_postman_tests
  - deploy_preship
  - integration
  - attribution
  - publish

include:
  - project: "osdu/platform/ci-cd-pipelines"
    file: "standard-setup.yml"
    ref: v0.17.3

  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/osdu-gcp-dag.yaml"
    ref: v0.17.3

  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/azure_dag.yml"
    ref: v0.17.3

  - local: "/devops/azure/override-stages.yml"
  - local: "/devops/gcp/pipeline/override-stages.yml"
  - local: "/devops/ibm/ibm-stages.yml"

  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/aws-global-variables.yml"
    ref: v0.17.3

  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/aws-dag.yml"
    ref: v0.17.3
