image: google/cloud-sdk:alpine

stages:
  - linters
  - deploy

isort:
  image: johnybear/osdu-airflow:python36-2
  allow_failure: true
  stage: linters
  script:
    - python -m pip install setuptools isort
    - isort -c -v src/*/*.py || EXIT_CODE=$?
    - exit ${EXIT_CODE}

osdu-gcp-deploy:
  stage: deploy
  script:
    - gcloud auth activate-service-account --key-file $OSDU_GCP_DEPLOY_FILE
    - cd src
    - gsutil -m rsync -d -R dags $OSDU_GCP_DEPL_TARGET/dags/segy_to_vds
  except:
    - /^release\/*/
  when: manual
