azure_deploy:
  tags: ["osdu-medium"]
  image: danielscholl/azure-build-image
  stage: deploy
  needs: ["azure_containerize"]
  variables:
    DAG_TAG: vds_dag:${CI_COMMIT_SHA}
  before_script:
    - az login --service-principal -u $AZURE_PRINCIPAL_ID -p $AZURE_PRINCIPAL_SECRET --tenant $AZURE_TENANT_ID
    - az aks get-credentials -g $AZURE_UNIQUE-rg -n $AZURE_UNIQUE-aks
  script:

    # Deploy the DAG to the airflow and register with Ingestion Service
    - |
      cat > .env << EOF
      DAG_IMAGE=${AZURE_REGISTRY}.azurecr.io/$DAG_TAG
      SHARED_TENANT=$SHARED_TENANT
      AZURE_TENANT_ID=$AZURE_TENANT_ID
      AZURE_DNS_NAME=$AZURE_DNS_NAME
      AZURE_AD_APP_RESOURCE_ID=$AZURE_AD_APP_RESOURCE_ID
      AZURE_CLIENT_ID=$AZURE_CLIENT_ID
      AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET
      EOF

      docker run --env-file .env $CI_REGISTRY_IMAGE/$DAG_TAG   
   
  only:
    variables:
      - $AZURE == 'true'
      
